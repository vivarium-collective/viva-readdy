name: tests

# Lean package CI for the pbg_readdy engine-provider.
#
# NOTE: the ReaDDy engine itself is conda-only and is NOT pip-installable, so
# `pip install -e .` cannot pull it in. `import pbg_readdy` still works (the
# engine is imported lazily, only when a simulation actually runs), and the
# pure-package tests collect and pass. Tests that exercise a real ReaDDy
# System/Simulation need a conda environment with `readdy` installed and will
# skip/fail here — that is expected for the pip-only CI runner.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" || \
            python -m pip install -e ".[test]" || \
            python -m pip install -e .
      - name: Import check
        run: python -c "import pbg_readdy; print(pbg_readdy.__name__)"
      - name: Run tests
        run: pytest -q
