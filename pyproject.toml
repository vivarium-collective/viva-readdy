[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-readdy"
version = "0.1.0"
description = "Process-bigraph wrapper for the ReaDDy particle-based reaction-diffusion simulator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "process-bigraph>=1.0",
    "bigraph-schema>=1.0",
    "viva-superpowers",
    "readdy>=2.0",
    "numpy",
    "pyyaml",
    "bigraph-viz>=2.0.3",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
cli = ["typer", "rich"]
dev = [
    "pytest",
    "bigraph-viz",
    "matplotlib",
]

[tool.uv.sources]
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["pbg_readdy*"]

[project.scripts]
viva-readdy = "pbg_readdy.cli.__main__:main"
